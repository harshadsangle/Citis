<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0F4C81" />
    <title>Offline | CITIS InfoTech</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#111827;font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(100%,540px);padding:48px 32px;border:1px solid #dbe3ed;border-radius:20px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(15,76,129,.1)}.mark{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:16px;background:linear-gradient(135deg,#0f4c81,#2563eb);color:#fff;font-size:28px;font-weight:800}h1{font-size:30px;margin:24px 0 12px}p{color:#64748b;line-height:1.7;margin:0 auto 28px;max-width:400px}button{border:0;border-radius:10px;background:#ff7a00;color:#fff;padding:13px 22px;font-weight:700;cursor:pointer}button:hover{background:#ea6f00}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f8fafc}.card{background:#162033;border-color:#2c3a50}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">C</div>
      <h1>You’re currently offline</h1>
      <p>Your connection appears to be unavailable. Previously visited pages may still work, or reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
